version: "3.9"

services:
  backend:
    build: ./backend
    container_name: animal-rescuer-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongo
    env_file:
      - ./backend/.env

  mongo:
    image: mongo:8
    container_name: animal-rescuer-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: